# ============================================
# FindJob Application Configuration - H2 Development Profile
# ============================================
# Use this profile for easy local development without PostgreSQL
# Usage: Set environment variable SPRING_PROFILES_ACTIVE=h2 or run with --spring.profiles.active=h2

# ============================================
# Server Configuration
# ============================================

server.port=8080
server.servlet.context-path=/
server.error.include-message=always

# ============================================
# Database Configuration (H2 In-Memory)
# ============================================

spring.datasource.url=jdbc:h2:mem:findjob;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (for development/debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# ============================================
# Thymeleaf Configuration
# ============================================

spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# ============================================
# Logging Configuration
# ============================================

logging.level.root=INFO
logging.level.com.findjob=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================
# Development Mode
# ============================================

app.development.mode=true
