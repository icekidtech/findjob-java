# Pxxl PostgreSQL profile. Keep credentials in environment variables, never in Git.
# Local development may provide them in a root .env file; hosting platforms
# should provide the same values through their environment-variable settings.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:postgresql://${PXXL_DB_HOST}:${PXXL_DB_PORT}/${PXXL_DB_NAME}?sslmode=require
spring.datasource.username=${PXXL_DB_USERNAME}
spring.datasource.password=${PXXL_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
