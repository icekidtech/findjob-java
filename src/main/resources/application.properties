# ============================================
# FindJob Application Configuration
# ============================================

# Application Name & Version
app.name=FindJob
app.version=1.0.0

# Run locally with the embedded H2 database unless another profile is selected.
spring.profiles.default=h2

# ============================================
# Server Configuration
# ============================================

server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# ============================================
# Database Configuration (Local Development)
# ============================================

# Datasource settings are supplied by the selected profile. The default is H2;
# use environment variables or a separate production profile for PostgreSQL.
spring.jpa.hibernate.ddl-auto=update

# Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ============================================
# Thymeleaf Configuration
# ============================================

spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.enabled=true

# ============================================
# Spring Security Configuration
# ============================================

# JWT Configuration
jwt.secret=your_jwt_secret_key_change_this_in_production
jwt.expiration=86400000

# Session Persistence Configuration
# Store sessions in database instead of memory so they persist across restarts
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.timeout=30d

# ============================================
# Logging Configuration
# ============================================

logging.level.root=INFO
logging.level.com.findjob=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/findjob.log

# ============================================
# File Upload Configuration
# ============================================

# Maximum file upload size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Local file upload directory (relative to application)
# Files will be stored in: ./uploads/cv and ./uploads/portfolio
file.upload.dir=./uploads/

# ============================================
# Email Configuration (Optional)
# ============================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_email_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ============================================
# Cache Configuration
# ============================================

spring.cache.type=true

# ============================================
# Jackson Configuration
# ============================================

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ============================================
# MVC Configuration
# ============================================

spring.mvc.static-path-pattern=/static/**
spring.resources.static-locations=classpath:/static/

# ============================================
# Development Configuration
# ============================================

# Allow H2 console access (if using H2)
# spring.h2.console.enabled=true

# Development mode features
app.development.mode=false
