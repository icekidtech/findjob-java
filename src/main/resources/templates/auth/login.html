<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FindJob</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Theme Variables */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f9f9f9;
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --text-primary: #333;
            --text-secondary: #666;
            --text-muted: #999;
            --border-color: #e0e0e0;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        [data-theme="dark"] {
            --bg-primary: #2d2d2d;
            --bg-secondary: #3a3a3a;
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #808080;
            --border-color: #444;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        [data-theme="brown"] {
            --bg-primary: #ffffff;
            --bg-secondary: #ebe6e0;
            --bg-gradient-start: #8d6e63;
            --bg-gradient-end: #6d4c41;
            --text-primary: #3e2723;
            --text-secondary: #5d4037;
            --text-muted: #8d6e63;
            --border-color: #d7ccc8;
            --shadow: 0 20px 60px rgba(93, 64, 55, 0.3);
        }

        [data-theme="green"] {
            --bg-primary: #ffffff;
            --bg-secondary: #e8f5e9;
            --bg-gradient-start: #43a047;
            --bg-gradient-end: #2e7d32;
            --text-primary: #1b5e20;
            --text-secondary: #2e7d32;
            --text-muted: #66bb6a;
            --border-color: #c8e6c9;
            --shadow: 0 20px 60px rgba(46, 125, 50, 0.3);
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s;
        }
        
        .auth-container {
            background: var(--bg-primary);
            border-radius: 15px;
            box-shadow: var(--shadow);
            max-width: 450px;
            width: 100%;
            padding: 50px 40px;
            transition: all 0.3s;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .auth-header .logo {
            font-size: 48px;
            color: var(--bg-gradient-start);
            margin-bottom: 15px;
        }
        
        .auth-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        
        .auth-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: block;
        }
        
        .form-control {
            border: 2px solid var(--border-color);
            padding: 12px 16px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .form-control:focus {
            border-color: var(--bg-gradient-start);
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }
        
        .btn-login {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            color: white;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
        }
        
        .remember-me input {
            margin-right: 8px;
        }
        
        .remember-me label {
            margin: 0;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .forgot-link {
            color: var(--bg-gradient-start);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
            color: var(--bg-gradient-start);
        }
        
        .signup-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .signup-link a {
            color: var(--bg-gradient-start);
            font-weight: 600;
            text-decoration: none;
        }
        
        .signup-link a:hover {
            text-decoration: underline;
        }
        
        .alert {
            margin-bottom: 20px;
            border-radius: 10px;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-primary);
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            padding: 8px;
            display: flex;
            gap: 5px;
            z-index: 1000;
        }

        .theme-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        .theme-btn.active {
            border-color: var(--bg-gradient-start);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .theme-btn-light { background: #f8f9fa; color: #ffa500; }
        .theme-btn-dark { background: #2d2d2d; color: #ffd700; }
        .theme-btn-brown { background: #8d6e63; color: #fff; }
        .theme-btn-green { background: #43a047; color: #fff; }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .auth-container {
                padding: 30px 25px;
            }

            .auth-header .logo {
                font-size: 36px;
            }

            .auth-header h1 {
                font-size: 24px;
            }

            .theme-toggle {
                bottom: 15px;
                right: 15px;
                padding: 6px;
            }

            .theme-btn {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 576px) {
            body {
                padding: 10px;
            }

            .auth-container {
                padding: 25px 20px;
            }

            .auth-header {
                margin-bottom: 25px;
            }

            .auth-header .logo {
                font-size: 32px;
                margin-bottom: 10px;
            }

            .auth-header h1 {
                font-size: 22px;
            }

            .form-group {
                margin-bottom: 15px;
            }

            .btn-login {
                font-size: 14px;
                padding: 10px 16px;
            }

            .theme-toggle {
                bottom: 10px;
                right: 10px;
                padding: 5px;
            }

            .theme-btn {
                width: 30px;
                height: 30px;
                font-size: 0.85rem;
            }

            .d-flex.justify-content-between {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start !important;
            }

            .forgot-link {
                margin-top: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <div class="logo">
                <i class="fas fa-briefcase"></i>
            </div>
            <h1>Login</h1>
            <p>Welcome back to FindJob</p>
        </div>

        <!-- Error Messages -->
        <th:block th:if="${error}">
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Login Failed!</strong>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </th:block>

        <!-- Login Form -->
        <form th:action="@{/auth/login}" method="POST" id="loginForm">
            <!-- CSRF Token (for Spring Security) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            
            <!-- Email Field -->
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" 
                       placeholder="your.email@example.com" required>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" 
                       placeholder="••••••••" required>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="remember-me">
                    <input type="checkbox" id="rememberMe" name="remember-me" value="true">
                    <label for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="forgot-link">
                    Forgot Password?
                </a>
            </div>

            <!-- Login Button -->
            <button type="submit" class="btn btn-login btn-primary">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <!-- Sign Up Link -->
        <div class="signup-link">
            Don't have an account? 
            <a th:href="@{/auth/register}">Create one</a>
        </div>
    </div>

    <!-- Theme Toggle -->
    <div class="theme-toggle">
        <button class="theme-btn theme-btn-light active" onclick="setTheme('light')" title="Light Mode">
            <i class="fas fa-sun"></i>
        </button>
        <button class="theme-btn theme-btn-dark" onclick="setTheme('dark')" title="Dark Mode">
            <i class="fas fa-moon"></i>
        </button>
        <button class="theme-btn theme-btn-brown" onclick="setTheme('brown')" title="Brown Mode">
            <i class="fas fa-tree"></i>
        </button>
        <button class="theme-btn theme-btn-green" onclick="setTheme('green')" title="Green Mode">
            <i class="fas fa-leaf"></i>
        </button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Theme Management & Form Validation -->
    <script>
        // Theme Management
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            
            // Update active button
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.theme-btn-${theme}`).classList.add('active');
        }

        // Load saved theme on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
        });

        // Form Validation
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            if (!email) {
                e.preventDefault();
                alert('Please enter your email');
                return;
            }
            
            if (!password) {
                e.preventDefault();
                alert('Please enter your password');
                return;
            }
        });
    </script>
</body>
</html>
