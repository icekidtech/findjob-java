<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FindJob</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        /* Theme Variables */
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f9f9f9;
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --text-primary: #333;
            --text-secondary: #666;
            --text-muted: #999;
            --border-color: #e0e0e0;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        [data-theme="dark"] {
            --bg-primary: #2d2d2d;
            --bg-secondary: #3a3a3a;
            --bg-gradient-start: #667eea;
            --bg-gradient-end: #764ba2;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --text-muted: #808080;
            --border-color: #444;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        [data-theme="brown"] {
            --bg-primary: #ffffff;
            --bg-secondary: #ebe6e0;
            --bg-gradient-start: #8d6e63;
            --bg-gradient-end: #6d4c41;
            --text-primary: #3e2723;
            --text-secondary: #5d4037;
            --text-muted: #8d6e63;
            --border-color: #d7ccc8;
            --shadow: 0 20px 60px rgba(93, 64, 55, 0.3);
        }

        [data-theme="green"] {
            --bg-primary: #ffffff;
            --bg-secondary: #e8f5e9;
            --bg-gradient-start: #43a047;
            --bg-gradient-end: #2e7d32;
            --text-primary: #1b5e20;
            --text-secondary: #2e7d32;
            --text-muted: #66bb6a;
            --border-color: #c8e6c9;
            --shadow: 0 20px 60px rgba(46, 125, 50, 0.3);
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s;
        }
        
        .auth-container {
            background: var(--bg-primary);
            border-radius: 15px;
            box-shadow: var(--shadow);
            max-width: 550px;
            width: 100%;
            padding: 50px 40px;
            transition: all 0.3s;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .auth-header .logo {
            font-size: 48px;
            color: var(--bg-gradient-start);
            margin-bottom: 15px;
        }
        
        .auth-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 10px;
        }
        
        .auth-header p {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: block;
        }
        
        .form-control {
            border: 2px solid var(--border-color);
            padding: 12px 16px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        
        .form-control:focus {
            border-color: var(--bg-gradient-start);
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.15);
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .form-control::placeholder {
            color: var(--text-muted);
        }
        
        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .role-option {
            position: relative;
            cursor: pointer;
        }
        
        .role-option input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            margin: 0;
            z-index: 1;
        }
        
        .role-card {
            padding: 20px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-secondary);
            pointer-events: none;
        }
        
        .role-option input[type="radio"]:checked + .role-card {
            border-color: var(--bg-gradient-start);
            background: var(--bg-secondary);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }
        
        .role-card:hover {
            border-color: var(--bg-gradient-start);
            transform: translateY(-2px);
        }
        
        .role-card i {
            font-size: 32px;
            color: var(--bg-gradient-start);
            margin-bottom: 10px;
        }
        
        .role-card h6 {
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
        }
        
        .role-card p {
            font-size: 12px;
            color: var(--text-muted);
            margin: 0;
        }
        
        .btn-register {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            border: none;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            width: 100%;
            margin-top: 10px;
        }
        
        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            color: white;
        }
        
        .terms-agreement {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .terms-agreement a {
            color: var(--bg-gradient-start);
            text-decoration: none;
            font-weight: 600;
        }
        
        .terms-agreement a:hover {
            text-decoration: underline;
        }
        
        .login-link {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .login-link a {
            color: var(--bg-gradient-start);
            font-weight: 600;
            text-decoration: none;
        }
        
        .login-link a:hover {
            text-decoration: underline;
        }
        
        .alert {
            margin-bottom: 20px;
            border-radius: 10px;
        }
        
        .text-muted {
            color: var(--text-muted) !important;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-primary);
            border-radius: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            padding: 8px;
            display: flex;
            gap: 5px;
            z-index: 1000;
        }

        .theme-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .theme-btn:hover {
            transform: scale(1.1);
        }

        .theme-btn.active {
            border-color: var(--bg-gradient-start);
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .theme-btn-light { background: #f8f9fa; color: #ffa500; }
        .theme-btn-dark { background: #2d2d2d; color: #ffd700; }
        .theme-btn-brown { background: #8d6e63; color: #fff; }
        .theme-btn-green { background: #43a047; color: #fff; }
        
        /* Mobile Responsive */
        @media (max-width: 768px) {
            .auth-container {
                padding: 30px 25px;
            }

            .auth-header .logo {
                font-size: 36px;
            }

            .auth-header h1 {
                font-size: 24px;
            }

            .theme-toggle {
                bottom: 15px;
                right: 15px;
                padding: 6px;
            }

            .theme-btn {
                width: 32px;
                height: 32px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 576px) {
            body {
                padding: 10px;
            }

            .auth-container {
                padding: 25px 20px;
            }

            .auth-header {
                margin-bottom: 25px;
            }

            .auth-header .logo {
                font-size: 32px;
                margin-bottom: 10px;
            }

            .auth-header h1 {
                font-size: 22px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
            
            .role-selector {
                grid-template-columns: 1fr;
            }

            .form-group {
                margin-bottom: 15px;
            }

            .btn-register {
                font-size: 14px;
                padding: 10px 16px;
            }

            .theme-toggle {
                bottom: 10px;
                right: 10px;
                padding: 5px;
            }

            .theme-btn {
                width: 30px;
                height: 30px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Header -->
        <div class="auth-header">
            <div class="logo">
                <i class="fas fa-briefcase"></i>
            </div>
            <h1>Sign Up</h1>
            <p>Join FindJob and start your journey</p>
        </div>

        <!-- Error Messages -->
        <th:block th:if="${error}">
            <div class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Registration Error!</strong>
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        </th:block>

        <!-- Registration Form -->
        <form th:action="@{/auth/register}" method="POST" id="registerForm">
            <!-- CSRF Token (Spring Security) -->
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            
            <!-- Role Selection -->
            <div class="form-group">
                <label class="form-label">I am a...</label>
                <div class="role-selector">
                    <div class="role-option">
                        <input type="radio" id="freelancer" name="role" value="FREELANCER" required>
                        <div class="role-card">
                            <i class="fas fa-laptop"></i>
                            <h6>Freelancer</h6>
                            <p>Offer your skills</p>
                        </div>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="client" name="role" value="CLIENT">
                        <div class="role-card">
                            <i class="fas fa-chart-bar"></i>
                            <h6>Client</h6>
                            <p>Hire talent</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Name Fields -->
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName" class="form-label">First Name</label>
                    <input type="text" class="form-control" id="firstName" name="firstName" 
                           placeholder="John" required>
                </div>
                <div class="form-group">
                    <label for="lastName" class="form-label">Last Name</label>
                    <input type="text" class="form-control" id="lastName" name="lastName" 
                           placeholder="Doe" required>
                </div>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" 
                       placeholder="your.email@example.com" required>
                <small class="text-muted">We'll use this to send you confirmation</small>
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" 
                       placeholder="••••••••" required minlength="8">
                <small class="text-muted">Minimum 8 characters</small>
            </div>

            <!-- Confirm Password Field -->
            <div class="form-group">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                       placeholder="••••••••" required>
            </div>

            <!-- Terms & Conditions -->
            <div class="form-group form-check">
                <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
                <label class="form-check-label terms-agreement" for="terms">
                    I agree to the 
                    <a href="#" target="_blank">Terms of Service</a> and 
                    <a href="#" target="_blank">Privacy Policy</a>
                </label>
            </div>

            <!-- Register Button -->
            <button type="submit" class="btn btn-register btn-primary">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <!-- Login Link -->
        <div class="login-link">
            Already have an account? 
            <a th:href="@{/auth/login}">Sign In</a>
        </div>
    </div>

    <!-- Theme Toggle -->
    <div class="theme-toggle">
        <button class="theme-btn theme-btn-light active" onclick="setTheme('light')" title="Light Mode">
            <i class="fas fa-sun"></i>
        </button>
        <button class="theme-btn theme-btn-dark" onclick="setTheme('dark')" title="Dark Mode">
            <i class="fas fa-moon"></i>
        </button>
        <button class="theme-btn theme-btn-brown" onclick="setTheme('brown')" title="Brown Mode">
            <i class="fas fa-tree"></i>
        </button>
        <button class="theme-btn theme-btn-green" onclick="setTheme('green')" title="Green Mode">
            <i class="fas fa-leaf"></i>
        </button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Theme Management -->
    <script>
        // Theme Management
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            
            // Update active button
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.theme-btn-${theme}`).classList.add('active');
        }

        // Load saved theme on page load
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
        });

        // Form validation
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const role = document.querySelector('input[name="role"]:checked');
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            
            if (!role) {
                e.preventDefault();
                alert('Please select your role');
                return;
            }
            
            if (!firstName || !lastName) {
                e.preventDefault();
                alert('Please enter your first and last name');
                return;
            }
            
            if (!email) {
                e.preventDefault();
                alert('Please enter your email');
                return;
            }
            
            if (password.length < 8) {
                e.preventDefault();
                alert('Password must be at least 8 characters');
                return;
            }
            
            if (password !== confirmPassword) {
                e.preventDefault();
                alert('Passwords do not match');
                return;
            }
            
            if (!terms) {
                e.preventDefault();
                alert('You must agree to the terms');
                return;
            }
        });
    </script>
</body>
</html>
