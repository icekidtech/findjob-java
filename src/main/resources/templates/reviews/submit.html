<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Review - FindJob</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: #f8f9fa;
        }
        
        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px 0;
            margin-bottom: 30px;
        }
        
        .review-form {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            margin: 0 auto;
        }
        
        .job-summary {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .job-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
        }
        
        .job-meta {
            display: flex;
            gap: 20px;
            font-size: 14px;
            color: #666;
        }
        
        .form-section {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .rating-group {
            margin-bottom: 20px;
        }
        
        .rating-label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 10px;
            display: block;
        }
        
        .star-rating {
            display: flex;
            gap: 10px;
            font-size: 32px;
        }
        
        .star {
            color: #ddd;
            cursor: pointer;
            transition: color 0.2s;
        }
        
        .star:hover,
        .star.active {
            color: #ffc107;
        }
        
        .rating-value {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .textarea-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            margin-bottom: 8px;
        }
        
        .form-control {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-text {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        
        .checkbox-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .checkbox-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .checkbox-item label {
            margin-bottom: 0;
            cursor: pointer;
            font-size: 14px;
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-cancel {
            background: #f0f0f0;
            border: none;
            color: #333;
            padding: 12px 30px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-cancel:hover {
            background: #e0e0e0;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="fas fa-briefcase"></i> FindJob
            </a>
        </div>
    </nav>

    <!-- Header -->
    <div class="header">
        <div class="container">
            <h1 class="display-6 fw-bold mb-2">Submit a Review</h1>
            <p class="lead mb-0">Share your experience working on this project</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <div class="review-form">
            <!-- Job Summary -->
            <div class="job-summary" th:if="${job != null}">
                <div class="job-title" th:text="${job.getTitle()}">Job Title</div>
                <div class="job-meta">
                    <span th:text="${job.getClient().getFirstName() + ' ' + job.getClient().getLastName()}">Client</span>
                    <span>•</span>
                    <span th:text="${#temporals.format(job.getCompletedAt(), 'MMM dd, yyyy')}">Completion Date</span>
                </div>
            </div>

            <!-- Review Form -->
            <form method="POST" th:action="@{/reviews/submit}">
                <input type="hidden" name="jobId" th:value="${job.getId()}">
                
                <!-- Overall Rating -->
                <div class="form-section">
                    <div class="section-title">Overall Experience</div>
                    
                    <div class="rating-group">
                        <label class="rating-label">How would you rate this experience?</label>
                        <div class="star-rating" id="overallRating">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <input type="hidden" name="overallRating" id="overallRatingValue" value="0">
                        <div class="rating-value" id="overallRatingText"></div>
                    </div>
                </div>

                <!-- Detailed Ratings -->
                <div class="form-section">
                    <div class="section-title">Detailed Ratings</div>
                    
                    <div class="rating-group">
                        <label class="rating-label">Quality of Work</label>
                        <div class="star-rating" data-type="quality">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <input type="hidden" name="qualityRating" class="rating-value" value="0">
                    </div>

                    <div class="rating-group">
                        <label class="rating-label">Communication</label>
                        <div class="star-rating" data-type="communication">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <input type="hidden" name="communicationRating" class="rating-value" value="0">
                    </div>

                    <div class="rating-group">
                        <label class="rating-label">Professionalism</label>
                        <div class="star-rating" data-type="professionalism">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <input type="hidden" name="professionalism" class="rating-value" value="0">
                    </div>

                    <div class="rating-group">
                        <label class="rating-label">Timeliness</label>
                        <div class="star-rating" data-type="timeliness">
                            <span class="star" data-value="1">★</span>
                            <span class="star" data-value="2">★</span>
                            <span class="star" data-value="3">★</span>
                            <span class="star" data-value="4">★</span>
                            <span class="star" data-value="5">★</span>
                        </div>
                        <input type="hidden" name="timeliness" class="rating-value" value="0">
                    </div>
                </div>

                <!-- Review Text -->
                <div class="form-section">
                    <div class="section-title">Your Feedback</div>
                    
                    <div class="textarea-group">
                        <label class="form-label">What went well?</label>
                        <textarea class="form-control" name="positives" rows="4" placeholder="Tell us what the freelancer did well..."></textarea>
                        <div class="form-text">Maximum 1000 characters</div>
                    </div>

                    <div class="textarea-group">
                        <label class="form-label">Areas for improvement</label>
                        <textarea class="form-control" name="areasForImprovement" rows="4" placeholder="What could be improved?"></textarea>
                        <div class="form-text">Maximum 1000 characters</div>
                    </div>

                    <div class="textarea-group">
                        <label class="form-label">General Comments</label>
                        <textarea class="form-control" name="reviewText" rows="5" placeholder="Share your complete experience..." required></textarea>
                        <div class="form-text">Minimum 20 characters required</div>
                    </div>
                </div>

                <!-- Options -->
                <div class="form-section">
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="wouldHireAgain" name="wouldHireAgain" value="true">
                            <label for="wouldHireAgain">I would hire this person again</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="isAnonymous" name="isAnonymous" value="true">
                            <label for="isAnonymous">Post anonymously</label>
                        </div>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="button-group">
                    <button type="button" class="btn-cancel" onclick="history.back()">Cancel</button>
                    <button type="submit" class="btn-submit">
                        <i class="fas fa-paper-plane"></i> Submit Review
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const ratingTexts = ['', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];
        
        document.querySelectorAll('.star-rating').forEach(ratingGroup => {
            const stars = ratingGroup.querySelectorAll('.star');
            const type = ratingGroup.getAttribute('data-type');
            const hiddenInput = type ? document.querySelector(`input[name="${type}Rating"]`) : document.getElementById('overallRatingValue');
            
            stars.forEach(star => {
                star.addEventListener('click', function() {
                    const value = this.getAttribute('data-value');
                    hiddenInput.value = value;
                    
                    stars.forEach(s => s.classList.remove('active'));
                    for (let i = 0; i < value; i++) {
                        stars[i].classList.add('active');
                    }
                    
                    if (!type) {
                        document.getElementById('overallRatingText').textContent = ratingTexts[value];
                    }
                });
                
                star.addEventListener('mouseover', function() {
                    const value = this.getAttribute('data-value');
                    stars.forEach(s => s.classList.remove('active'));
                    for (let i = 0; i < value; i++) {
                        stars[i].classList.add('active');
                    }
                });
            });
            
            ratingGroup.addEventListener('mouseout', function() {
                const value = hiddenInput.value;
                stars.forEach(s => s.classList.remove('active'));
                for (let i = 0; i < value; i++) {
                    stars[i].classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
